name: Build Windows Release

on:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container:
      image: registry.example:3000/rodlegacy/win32-builder:20260828

    steps:
      # node comes from the image; only zip is missing.
      - name: Install packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends zip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The project defaults to buildtype=debug; a static mingw build of that is
      # ~70 MB of debug symbols.
      - name: Configure build
        run: meson setup builddir --cross-file /cross-mingw.txt --buildtype=release

      # Only the game target. The doctest suite cannot cross-compile: mingw's
      # win32 threads model has no std::mutex, and it is run natively in build-test.
      - name: Compile project
        run: ninja -C builddir rodlegacy.exe

      - name: Verify executable
        run: |
          test -f builddir/rodlegacy.exe
          i686-w64-mingw32-strip builddir/rodlegacy.exe
          ls -la builddir/rodlegacy.exe

      - name: Assemble release directory
        run: |
          mkdir -p release
          cp builddir/rodlegacy.exe release/
          cat > release/README.txt <<'EOF'
          RodLegacy Windows Build
          =================================

          To run the game:
          1. Extract all files to a folder
          2. Place your SR1AMIGA_DISK1.adf and SR1AMIGA_DISK2.adf files in the data folder
          3. Run rodlegacy.exe

          Controls:
          - Mouse: Navigate and click
          - Ctrl+F: Toggle fullscreen
          - Escape: Exit game
          EOF
          zip -r rod-legacy-windows.zip release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: streetrod-legacy-windows
          path: release/
          retention-days: 30

      # Forgejo has no GitHub releases API, so attach the asset with its own.
      - name: Attach zip to release
        run: |
          curl -sSf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -F "attachment=@rod-legacy-windows.zip" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=rod-legacy-windows.zip"
