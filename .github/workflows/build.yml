name: Build

on:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write

defaults:
    run:
        shell: bash

jobs:
    linux:
        runs-on: ubuntu-latest
        container:
            image: debian:trixie
        env:
            APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE inside the container

        steps:
            - name: Install build and packaging dependencies
              env:
                  DEBIAN_FRONTEND: noninteractive
              run: |
                  apt-get update -qq
                  apt-get install -y -qq --no-install-recommends \
                    build-essential cmake meson ninja-build pkg-config \
                    libsdl2-dev libogg-dev libvorbis-dev \
                    libasound2-dev libpulse-dev \
                    libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev \
                    libxfixes-dev libxrandr-dev libxss-dev libxxf86vm-dev libxrender-dev \
                    libxcb1-dev libxau-dev libxdmcp-dev \
                    libdrm-dev libgbm-dev libwayland-dev libxkbcommon-dev libdecor-0-dev \
                    git ca-certificates nodejs \
                    dpkg-dev fakeroot alien rpm file patchelf desktop-file-utils wget

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive

            # buildtype=release: the project defaults to debug, which is all symbols.
            - run: meson setup builddir --buildtype=release

            # TAG names the files; DEBVER goes in the package metadata and must
            # start with a digit, so a sha build is the project version plus the sha
            # rather than the bare sha.
            - name: Derive version strings
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  VERSION=$(python3 -c "import json;print(json.load(open('builddir/meson-info/intro-projectinfo.json'))['version'])")
                  TAG=$VERSION
                  DEBVER=$VERSION
                  printf 'TAG=%s\nDEBVER=%s\n' "$TAG" "$DEBVER" >> "$GITHUB_ENV"

            - name: Compile
              run: |
                  ninja -C builddir rodlegacy
                  strip builddir/rodlegacy

            # One staged tree, reused by every format below.
            - name: Stage install tree
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  install -Dm755 builddir/rodlegacy           stage/usr/bin/rodlegacy
                  install -Dm644 packaging/rodlegacy.desktop  stage/usr/share/applications/rodlegacy.desktop
                  install -Dm644 data/res/icon.png            stage/usr/share/icons/hicolor/512x512/apps/rodlegacy.png
                  # install -Dm644 README.md                  stage/usr/share/doc/rodlegacy/README.md

            - name: Resolve runtime dependencies
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  mkdir -p shlibdeps/debian
                  printf 'Source: rodlegacy\n\nPackage: rodlegacy\nArchitecture: any\n' > shlibdeps/debian/control
                  DEPS=$(cd shlibdeps && dpkg-shlibdeps -O --ignore-missing-info ../stage/usr/bin/rodlegacy | sed 's/^shlibs:Depends=//')
                  echo "DEPS=$DEPS" >> "$GITHUB_ENV"

            - name: Build .deb
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  mkdir -p stage/DEBIAN
                  cat > stage/DEBIAN/control <<EOF
                  Package: rodlegacy
                  Version: ${DEBVER}
                  Section: games
                  Priority: optional
                  Architecture: amd64
                  Depends: ${DEPS}
                  Maintainer: RodLegacy Project <noreply@grovdata.se>
                  Description: Reimplementation of the classic Street Rod game
                   RodLegacy plays the original Street Rod on modern systems.

                  EOF
                  fakeroot dpkg-deb --build stage "rodlegacy-${TAG}.deb"

            # alien converts the deb rather than maintaining a second spec file.
            - name: Build .rpm
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  alien --to-rpm --keep-version "rodlegacy-${TAG}.deb"
                  mv rodlegacy-*.x86_64.rpm "rodlegacy-${TAG}.rpm"

            # linuxdeploy copies the shared libs the ELF needs into the AppDir.
            - name: Build .AppImage
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  base=https://github.com/linuxdeploy
                  wget -qP /usr/local/bin "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
                  wget -qP /usr/local/bin "$base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
                  chmod +x /usr/local/bin/linuxdeploy*.AppImage
                  cp data/res/icon.png rodlegacy.png
                  OUTPUT="rodlegacy-${TAG}.AppImage" \
                  linuxdeploy-x86_64.AppImage --appdir AppDir \
                    -e builddir/rodlegacy \
                    -d packaging/rodlegacy.desktop \
                    -i rodlegacy.png \
                    --output appimage

            - name: Build .tar.gz
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  mkdir -p "rodlegacy-${TAG}"
                  # README.md left out until it is cleaned up for shipping.
                  cp builddir/rodlegacy packaging/rodlegacy.desktop data/res/icon.png "rodlegacy-${TAG}/"
                  tar czf "rodlegacy-${TAG}.tar.gz" "rodlegacy-${TAG}"

            - name: Attach to release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  files: |
                      *.deb
                      *.rpm
                      *.AppImage
                      *.tar.gz

    windows:
        runs-on: ubuntu-latest
        # Cross toolchain image, see Dockerfile.win32.
        container:
            image: ghcr.io/grovdata/win32-builder:latest
        steps:
            # node comes from the image - bullseye's apt node is v12 and too old for
            # the JS actions below. Only zip is missing.
            - name: Install packaging tools
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  DEBIAN_FRONTEND: noninteractive
              run: |
                  apt-get update -qq
                  apt-get install -y -qq --no-install-recommends zip

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive

            - run: meson setup builddir --cross-file /cross-mingw.txt --buildtype=release

            - name: Derive version string
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  VERSION=$(python3 -c "import json;print(json.load(open('builddir/meson-info/intro-projectinfo.json'))['version'])")
                  TAG=$VERSION
                  echo "TAG=$TAG" >> "$GITHUB_ENV"

            - name: Compile
              run: |
                  ninja -C builddir rodlegacy.exe
                  i686-w64-mingw32-strip builddir/rodlegacy.exe

            - name: Build zip
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  zip -j "rodlegacy-${TAG}-windows.zip" builddir/rodlegacy.exe

            - name: Attach to release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  files: |
                      rodlegacy-${{ env.TAG }}-windows.zip

    mac:
        runs-on: macos-latest
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        steps:
            - run: brew install meson ninja pkgconf
            - run: softwareupdate --install-rosetta --agree-to-license || true
            - run: arch -x86_64 /usr/bin/true && echo "rosetta ok"

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive

            - name: Build .app and .dmg
              run: scripts/build_macos_app.sh

            - name: Check slices
              run: |
                  B=build-macos/RodLegacy.app/Contents/MacOS/rodlegacy
                  lipo -info "$B"
                  for a in arm64 x86_64; do otool -l -arch $a "$B" | grep -A3 LC_BUILD_VERSION | grep minos; done

            - name: Upload dmg
              if: ${{ !startsWith(github.ref, 'refs/tags/') }}
              uses: actions/upload-artifact@v4
              with:
                  name: macos-dmg
                  path: build-macos/RodLegacy-*.dmg

            - name: Attach to release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  files: build-macos/RodLegacy-*.dmg

    haiku:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                arch: [x86, x86_64]
        # Cross toolchain images, see Dockerfile.haiku. x86 is the 32-bit gcc13 arch of x86_gcc2h.
        container:
            image: ghcr.io/grovdata/haiku-builder-${{ matrix.arch }}:latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive

            - run: meson setup builddir --cross-file /cross-haiku.txt --buildtype=release

            - name: Derive version string
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  VERSION=$(python3 -c "import json;print(json.load(open('builddir/meson-info/intro-projectinfo.json'))['version'])")
                  echo "TAG=$VERSION" >> "$GITHUB_ENV"

            - name: Compile
              run: |
                  ninja -C builddir rodlegacy
                  "${TRIPLE}-strip" builddir/rodlegacy

            - name: Build zip
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  zip -j "rodlegacy-${TAG}-haiku-${{ matrix.arch }}.zip" builddir/rodlegacy

            - name: Attach to release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  files: |
                      rodlegacy-${{ env.TAG }}-haiku-${{ matrix.arch }}.zip
