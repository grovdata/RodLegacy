name: Build Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker image
      run: |
        # Build the Docker image for Windows cross-compilation with caching
        docker buildx build --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache,mode=max -f Dockerfile.win32 -t streetrod-win32-builder .

    - name: Update subprojects
      run: |
        # Update subprojects in the container
        docker run --rm -v "$(pwd):/project" streetrod-win32-builder bash -c "
          cd /project &&
          meson subprojects update
        "

    - name: Configure build
      run: |
        # Configure the build with meson
        docker run --rm -v "$(pwd):/project" streetrod-win32-builder bash -c "
          cd /project &&
          meson setup builddir --cross-file /cross-mingw.txt
        "

    - name: Compile project
      run: |
        # Compile the project with ninja
        docker run --rm -v "$(pwd):/project" streetrod-win32-builder bash -c "
          cd /project/builddir &&
          ninja
        "

    - name: Verify executable
      run: |
        if [ -f "builddir/src/open_sr.exe" ]; then
          echo "✅ Windows executable built successfully!"
          ls -la builddir/src/open_sr.exe
        else
          echo "❌ Windows executable not found!"
          exit 1
        fi

    - name: Upload executable for testing
      uses: actions/upload-artifact@v4
      with:
        name: open_sr.exe
        path: builddir/src/open_sr.exe
        retention-days: 7 