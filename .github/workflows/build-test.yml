name: Build Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    # trixie, not bookworm: meson.options needs meson >= 1.1, bookworm ships 1.0.1
    container:
      image: debian:trixie

    steps:
      # Must run before any JS action: a bare debian image has no node or git,
      # and actions/checkout needs both.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake meson ninja-build pkg-config \
            libsdl2-dev libogg-dev libvorbis-dev \
            git ca-certificates nodejs

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: meson setup builddir

      # Only the test target: building `all` would drag in the game's X11,
      # wayland and pulse link deps for no benefit here.
      - name: Build unit tests
        run: ninja -C builddir tests/test_libp

      - name: Run unit tests
        run: meson test -C builddir --no-rebuild --print-errorlogs
